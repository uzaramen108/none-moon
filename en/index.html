<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Paper Review and Summary Dashboard</title><link rel="stylesheet" href="../resources/style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css"><script defer="defer" src="../runtime.c5f14d9c7cd719ad6181.js"></script><script defer="defer" src="../main.36087195a8cfaba0ee16.js"></script><script defer="defer" src="../dark_color_scheme.23d6df4a8a2012fcd502.js"></script><link href="../main.52e86fa132c09254a80b.css" rel="stylesheet"></head><body><div id="mobile-backdrop" class="mobile-backdrop"></div><div class="app-container"><aside class="sidebar" id="sidebar"><div class="sidebar-header"><h2>Select Paper</h2><span class="badge" id="paper-count">0 Papers</span></div><ul id="paper-list" class="paper-list"></ul></aside><div class="content-wrapper"><main class="viewer-container" id="viewer-container"><div class="panel-header"><div style="display: flex; align-items: center; gap: 12px; overflow: hidden;"><button id="btn-toggle-sidebar" class="btn btn-secondary" style="padding: 6px 10px; flex-shrink: 0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button><h2 id="viewer-title">Select a Paper</h2></div><a id="pdf-download-link" href="#" download class="btn btn-primary" style="display: none;">Download PDF</a></div><div class="image-viewport" id="viewport-container"><div id="viewer-placeholder" class="placeholder-msg"><p>Select a paper from the list on the left to view its PDF.</p></div><canvas id="pdf-render-canvas" style="display: none; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); z-index: 1;"></canvas></div>
