<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>연구 논문 검토 및 요약 대시보드</title><link rel="stylesheet" href="../resources/style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css"><script defer="defer" src="../runtime.c5f14d9c7cd719ad6181.js"></script><script defer="defer" src="../ko.f19fbee53647de969d1a.js"></script><script defer="defer" src="../main.29c2da8751e8afc2c8ed.js"></script><script defer="defer" src="../dark_color_scheme.23d6df4a8a2012fcd502.js"></script><link href="../main.52e86fa132c09254a80b.css" rel="stylesheet"></head><body style="margin: 0; overflow: hidden;"><div id="mobile-backdrop" class="mobile-backdrop"></div><div class="app-container" style="display: flex; width: 100vw; height: 100vh;"><aside class="sidebar" id="sidebar" style="position: relative; z-index: 20;"><div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #1e1e2d; color: #fff; border-bottom: 1px solid #333;"><span id="current-user-display" style="font-size: 0.9em; font-weight: bold; color: #a5b4fc;">👤 닉네임</span> <button id="btn-logout" class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.75em; background: #334155; border: none; color: white;">로그아웃</button></div><div class="sidebar-header" style="display: flex; justify-content: space-between; align-items: center; gap: 8px;"><h2 style="margin: 0; font-size: 1.3em;">논문 선택</h2><div style="display: flex; align-items: center; gap: 6px;"><label for="pdf-upload-input" class="btn btn-primary" style="padding: 4px 8px; font-size: 0.85em; cursor: pointer; white-space: nowrap; background-color: #3b82f6;">투고</label> <input type="file" id="pdf-upload-input" accept=".pdf" style="display: none;"> <button id="btn-management" class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.85em; cursor: pointer; white-space: nowrap; background-color: #e2e8f0; border: none; color: #333;" title="내 라이브러리 관리">⚙️ 관리</button> <span class="badge" id="paper-count">0 Papers</span></div></div><ul id="paper-list" class="paper-list"></ul></aside><div id="main-area" style="flex: 1; display: flex; flex-direction: row; overflow: hidden; background-color: #f4f6f8; min-width: 0;"><main class="viewer-container" id="viewer-container" style="flex: 6; display: flex; flex-direction: column; height: 100%; overflow: hidden; position: relative; min-width: 0;"><div class="panel-header" style="flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #ddd; background: #fff; position: relative; z-index: 10;"><div style="display: flex; align-items: center; gap: 12px; overflow: hidden; min-width: 0;"><button id="btn-toggle-sidebar" class="btn btn-secondary" style="padding: 6px 10px; flex-shrink: 0; white-space: nowrap;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button><h2 id="viewer-title" style="margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 1.2em;">논문을 선택해주세요</h2></div><a id="pdf-download-link" href="#" download class="btn btn-primary" style="display: none; white-space: nowrap; flex-shrink: 0; padding: 8px 16px;">PDF 다운로드</a></div><div class="image-viewport" id="viewport-container" style="flex: 1; overflow: auto; background-color: #f4f6f8; text-align: center; position: relative;"><div id="viewer-placeholder" class="placeholder-msg" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); word-break: keep-all;"><p>좌측 목록에서 논문을 선택하시면 PDF가 렌더링됩니다.</p></div><div id="pdf-padding-wrapper" style="display: none; padding: 60px 20px; text-align: left; margin: 0 auto; width: max-content;"><div id="pdf-wrapper" style="position: relative; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); background: white; z-index: 1;"><canvas id="pdf-render-canvas" style="display: block;"></canvas></div></div></div><div id="viewer-controls" class="viewer-controls" style="display: none; flex-shrink: 0; justify-content: center; align-items: center; padding: 10px; background: white; border-top: 1px solid #ddd; position: relative; z-index: 10;"><button id="btn-prev" class="btn btn-secondary" style="white-space: nowrap;">이전 장</button> <span id="page-number-indicator" style="margin: 0 15px; font-weight: bold; font-family: monospace; white-space: nowrap;">1 / ?</span> <button id="btn-next" class="btn btn-secondary" style="white-space: nowrap;">다음 장</button></div></main><aside id="summary-container" style="flex: 4; display: none; flex-direction: column; height: 100%; border-left: 1px solid #ddd; background-color: #ffffff; padding: 20px; box-sizing: border-box; min-width: 0;"><div class="panel-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; flex-shrink: 0;"><h3 style="margin: 0; font-size: 1.2em; color: #333; white-space: nowrap;">📝 논문 요약본</h3><button id="btn-edit-summary" class="btn btn-secondary" style="display: none; white-space: nowrap; flex-shrink: 0;">새로 작성</button></div><div id="summary-placeholder" class="placeholder-msg" style="flex: 1; display: flex; align-items: center; justify-content: center; word-break: keep-all;"><p style="color: #666; text-align: center;">논문을 선택하면 이곳에 요약본이 표시됩니다.</p></div><div id="summary-wrapper" style="display: none; flex: 1; flex-direction: column; height: 100%;"><div id="summary-meta" style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9em; color: #555;"><span id="summary-author" style="font-weight: bold;">작성자: -</span> <span id="summary-date">작성일: -</span></div><textarea id="summary-edit-area" readonly="readonly" style="flex: 1; width: 100%; border: none; resize: none; outline: none; font-family: inherit; font-size: 1em; line-height: 1.6; color: #444; background: transparent; padding: 0; margin: 0;"></textarea><div id="summary-controls" style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee;"><div style="display: flex; gap: 8px;"><button id="btn-vote-help" class="btn" style="background: #e0f2fe; color: #0284c7; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.9em;">👍 0</button> <button id="btn-vote-revise" class="btn" style="background: #fee2e2; color: #dc2626; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.9em;">⚠️ 0</button></div><div style="display: flex; align-items: center; gap: 10px;"><button id="btn-sum-prev" class="btn btn-secondary" style="padding: 4px 8px;">◀</button> <span id="summary-nav-indicator" style="font-weight: bold; font-family: monospace;">1 / 1</span> <button id="btn-sum-next" class="btn btn-secondary" style="padding: 4px 8px;">▶</button></div></div></div></aside></div></div><style>/* 강력 조치: 모든 버튼과 사이드바를 최상단으로 강제 고정 */

        aside#summary-container.editing { background-color: #f3f4f6 !important; }
