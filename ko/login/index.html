<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 - 연구 논문 대시보드</title><link rel="stylesheet" href="../../resources/style.css"><style>.auth-container {
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; background-color: #f4f6f8;
        }
        .auth-box {
            background: white; padding: 40px; border-radius: 8px; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 400px;
        }
        .auth-box h2 { margin-top: 0; color: #1e1e2d; text-align: center; margin-bottom: 24px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; color: #555; }
        .input-group input { 
            width: 100%; padding: 10px; border: 1px solid #ddd; 
            border-radius: 4px; box-sizing: border-box; font-size: 1em;
        }
        .auth-btn { width: 100%; padding: 12px; font-size: 1.1em; margin-top: 10px; }
        .toggle-link { text-align: center; margin-top: 15px; font-size: 0.9em; color: #3b82f6; cursor: pointer; }
        .toggle-link:hover { text-decoration: underline; }
        
        /* 💡 핵심: 요소를 숨기는 CSS 클래스 추가 */
        .hidden { display: none !important; }</style><script defer="defer" src="../../runtime.c5f14d9c7cd719ad6181.js"></script><script defer="defer" src="../../login.54ccf8e248ae433bfde3.js"></script><script defer="defer" src="../../dark_color_scheme.23d6df4a8a2012fcd502.js"></script></head><body><div class="auth-container"><div class="auth-box"><h2 id="auth-title-signin">즐거운 논문생활 ^ ^...</h2><h2 id="auth-title-signup" class="hidden">논문의 세계로 어서오세요~...</h2><form id="auth-form"><div class="input-group"><label for="nickname">닉네임</label> <input type="text" id="nickname" required placeholder="닉네임을 입력하세요"></div><div class="input-group"><label for="password">비밀번호</label> <input type="password" id="password" required placeholder="비밀번호를 입력하세요"></div><button type="submit" id="submit-btn-signin" class="btn btn-primary auth-btn">로그인</button> <button type="submit" id="submit-btn-signup" class="btn btn-primary auth-btn hidden">회원가입</button></form><div class="toggle-link" id="toggle-mode-btn-signin">계정이 없으신가요? 회원가입하기</div><div class="toggle-link hidden" id="toggle-mode-btn-signup">이미 계정이 있으신가요? 로그인하기</div><div style="text-align: center; margin-top: 15px;"><a href="../index.html" style="color: #888; font-size: 0.85em; text-decoration: none;">메인으로 돌아가기</a></div></div></div><footer><p>깃헙 코드는 다음에서 보실 수 있습니다: <a href="https://github.com/uzaramen108/none-moon" target="_blank">GitHub Repository</a></p><p class="copyright">&copy; 2026 none-moon, The Research Paper Dashboard. All rights reserved.</p></footer></body></html>
